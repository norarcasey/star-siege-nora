name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1; Node 20 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      # No token needed: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential, and attaches provenance automatically.
      # publish runs prepublishOnly (build) first.
      - run: npm publish --access public
