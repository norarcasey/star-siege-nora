name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "Tag matches package.json version: $PKG"
      # Trusted Publishing needs npm >= 11.5.1; Node 20 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      # No token needed: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential, and attaches provenance automatically.
      # publish runs prepublishOnly (build) first.
      - run: npm publish --access public
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the notes for this version out of CHANGELOG.md: everything
          # between this version's "## [x.y.z]" heading and the next "## [".
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "No CHANGELOG entry for $VERSION; falling back to auto-generated notes."
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          fi
